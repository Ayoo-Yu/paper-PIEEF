experiment:
  model: PI-EEF
  horizon: 1
  eval_scope: measured-target
  finalized: true
  group: main
  site: wind_farm_A
  exp_type: energy_r3_stage2
  models:
  - PI-EEF
  variant: PI-EEF
  seeds:
  - 42
data:
  data_version: energy_revision_wind_farm_A_author_prepared_EC_20261017
  scada_path: data/wind_farm_A/scada_ecmwf_15min.csv
  turbines_path: data/wind_farm_A/turbines.csv
  seq_len: 96
  split:
  - 0.7
  - 0.1
  - 0.2
  capacity_mw: 2.0
  revision_protocol:
    nwp_alignment_verified: false
    nwp_preparation_author_confirmed: true
    timezone: Asia/Shanghai
    step_minutes: 15
    power_unit: kW
    wind_height_m: 10
    nwp_timing_rule: author_prepared_ecmwf
    nwp_feature_columns:
    - nwp_direct_solar_radiation
    - nwp_total_sky_direct_shortwave
    - nwp_surface_pressure_pa
    - nwp_temperature_2m_k
    - nwp_u10_ms
    - nwp_v10_ms
    - nwp_wind_speed200_ms
    - nwp_wind_speed100_ms
    - nwp_wind_speed10_ms
    input_filling: forward-only
    target_policy: raw-measured-valid-power
model:
  d_model: 128
  encoder_depth: 3
  graph_depth: 1
  mask_ratio: 0.4
  num_control_points: 15
  use_prior_input: true
  use_bound_loss: true
  use_derivative_loss: true
  use_density: true
  nwp_target_speed_index: 7
  use_terrain_bias: true
  use_mask_indicators: true
  joint_masking: false
  cut_in_speed: 3.0
  rated_wind_speed: 10.0
  cut_out_speed: 22.0
  sensitivity_mode: symmetric
  manufacturer_curve_path: data/wind_farm_A/manufacturer_curve.csv
  use_calibration: true
  use_physics_curve: true
  curve_mode: bspline
  use_direction_bias: true
  use_sensitivity_gate: true
  revin_missing_policy: train_stats_20
  forecast_head_policy: target_nwp_physics_mlp
  graph_score_policy: cosine_temperature
  forecast_skip_policy: last_obs_linear
train:
  batch_size: 16
  epochs_stage1: 5
  epochs_stage2: 5
  epochs_stage3: 20
  lr_stage1: 0.001
  lr_stage2: 0.001
  lr_stage3: 0.0003
  stage3_mode: staged
  loss_name: huber
  huber_delta: 0.1
  quantile: 0.5
  patience: 5
  checkpoint_metric: nrmse
  reconstruction_weight: 0.05
  calibration_weight: 0.05
  auxiliary_decay: 0.1
  record_gradient_conflicts: false
  epochs: 50
  lr: 0.001
  stage3_decoder_policy: frozen
  stage3_forecast_corruption: f2_block
tracking:
  artifact_root: artifacts/public
  ledger_dir: artifacts/public/summary
  source_manifest: provenance/source_manifest.json
