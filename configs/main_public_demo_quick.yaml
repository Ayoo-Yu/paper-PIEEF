experiment:
  exp_type: main
  model: PI-EEF
  variant: Ours
  seeds: [42]
  horizon: 16
  eval_scope: all-sample

data:
  data_version: public_demo_synth_v1
  dms_path: data/public_demo/DMS.csv
  turbines_path: data/public_demo/turbines.csv
  seq_len: 96
  split: [0.7, 0.1, 0.2]
  capacity_mw: 2.0

model:
  d_model: 128

train:
  batch_size: 32
  epochs_stage1: 1
  epochs_stage2: 1
  epochs_stage3: 2
  lr_stage1: 0.001
  lr_stage2: 0.001
  lr_stage3: 0.0003

tracking:
  config_id: main_public_demo_quick_v1
  artifact_root: artifacts/public_demo/main_quick
  ledger_dir: ledger
